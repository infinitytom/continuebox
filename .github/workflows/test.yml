name: Validate ContinueBox public sources
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r sync-server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: sync-server
      - run: python tools/verify_public.py
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x native-ui/gradlew
      - run: ./gradlew :cards:assembleRelease --no-daemon
        working-directory: native-ui
