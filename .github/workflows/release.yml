name: Rebuild public APK (unsigned)
on:
  workflow_dispatch:
    inputs:
      base_release:
        description: Release containing ContinueBox-build-base.apk
        default: v2.2.5
        required: true
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download build inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RELEASE: ${{ inputs.base_release }}
        run: |
          gh release download "$BASE_RELEASE" -R "$GITHUB_REPOSITORY" -p ContinueBox-build-base.apk
          curl --fail --location --output apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
      - run: python tools/rebuild_public.py --base ContinueBox-build-base.apk --apktool apktool.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ContinueBox-2.2.5-unsigned
          path: ContinueBox-2.2.5-unsigned.apk
